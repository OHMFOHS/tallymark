name: Execution safety
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: git diff --exit-code -- packages/contracts/schema.json
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Verify the isolated fixture
        run: |
          node dist/packages/cli/main.js init
          node dist/packages/cli/main.js list
          node dist/packages/cli/main.js test --config reliability.yaml --out artifacts/safe
      - name: Require a definite violation from the unsafe control
        shell: bash
        run: |
          node dist/packages/cli/main.js init -c unsafe.yaml --fixture unsafe
          status=0
          node dist/packages/cli/main.js test -c unsafe.yaml --out artifacts/unsafe || status=$?
          test "$status" -eq 1
      - name: Install locked external implementations
        if: matrix.node != 22
        shell: bash
        run: |
          npm ci --prefix integrations/reference --ignore-scripts --no-audit --no-fund
          python3 -m venv "$RUNNER_TEMP/mrk-uv"
          "$RUNNER_TEMP/mrk-uv/bin/python" -m pip install uv==0.9.28
          "$RUNNER_TEMP/mrk-uv/bin/uv" python install 3.13
          "$RUNNER_TEMP/mrk-uv/bin/uv" sync --locked --no-install-project --project integrations/reference
      - name: Check external observations and the deliberate negative control
        if: matrix.node != 22
        run: pnpm test:reference
      - name: Verify Backburner transaction and settlement evidence
        if: matrix.node == 24
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/mrk-uv/bin:$PATH"
          uv sync --locked --no-install-project --project integrations/backburner
          uv run --locked --project integrations/backburner python -m unittest discover -s integrations/backburner -v
          pnpm test:backburner
      - name: Measure cancellation on both Streamable HTTP protocol generations
        if: matrix.node == 24
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/mrk-uv/bin:$PATH"
          npm ci --prefix integrations/cancellation --ignore-scripts --no-audit --no-fund
          pnpm test:cancellation
      - run: pnpm test:package --npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-${{ matrix.os }}-node-${{ matrix.node }}
          if-no-files-found: error
          path: |
            artifacts/**/*.json
            artifacts/**/*.xml
            artifacts/reference/**/discovery.txt
            artifacts/pack/*.tgz
            artifacts/pack/*.sha256
          retention-days: 7
